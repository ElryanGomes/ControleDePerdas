<!-- ===================== MODAL: SCANNER ===================== -->
<div id="scannerModal" class="modal-overlay">
  <div class="modal-box">
    <div id="reader"></div>
    <div class="scan-hint">Aponte a câmera para o código de barras</div>
    <button class="btn btn-outline btn-block" id="btnCancelScan">Cancelar</button>
  </div>
</div>

<!-- ===================== MODAL: NOVO FORNECEDOR ===================== -->
<div id="fornecedorModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Novo fornecedor</h3>
    <div class="field">
      <label class="field-label">Nome do fornecedor</label>
      <input type="text" id="fornModalInput" placeholder="Ex: M DIAS BRANCO">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="btnCancelForn">Cancelar</button>
      <button class="btn btn-primary" id="btnSaveForn">Salvar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: PRODUTO (novo / editar) ===================== -->
<div id="produtoModal" class="modal-overlay">
  <div class="modal-box">
    <h3 id="prodModalTitle">Novo produto</h3>
    <div class="field">
      <label class="field-label">Fornecedor</label>
      <select id="prodModalForn"></select>
    </div>
    <div class="field">
      <label class="field-label">Código do produto</label>
      <input type="text" id="prodModalCodProd" class="mono-input">
    </div>
    <div class="field">
      <label class="field-label">Código de barras</label>
      <input type="text" id="prodModalCodBarra" class="mono-input">
    </div>
    <div class="field">
      <label class="field-label">Descrição</label>
      <input type="text" id="prodModalDesc">
    </div>
    <div class="field">
      <label class="field-label">Preço de compra (R$)</label>
      <input type="number" id="prodModalValor" step="0.01" min="0">
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="btnDeleteProd" style="display:none;">Excluir</button>
      <button class="btn btn-outline" id="btnCancelProd">Cancelar</button>
      <button class="btn btn-primary" id="btnSaveProd">Salvar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: EDITAR REGISTRO DE PERDA ===================== -->
<div id="perdaModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Editar registro</h3>

    <div class="field">
      <label class="field-label">Fornecedor</label>
      <input type="text" id="perdaModalForn" list="perdaModalFornDatalist" placeholder="Digite ou selecione o fornecedor…">
      <datalist id="perdaModalFornDatalist"></datalist>
    </div>

    <div class="field">
      <label class="field-label">Descrição</label>
      <input type="text" id="perdaModalDesc">
    </div>

    <div class="field">
      <label class="field-label">Código do produto</label>
      <input type="text" id="perdaModalCodigo" class="mono-input">
    </div>

    <div class="field">
      <label class="field-label">Motivo</label>
      <div class="toggle-group">
        <button type="button" class="toggle-btn" data-tipo="VENCIDO">Vencido</button>
        <button type="button" class="toggle-btn" data-tipo="AVARIADO">Avariado</button>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label class="field-label">Quantidade</label>
        <input type="number" id="perdaModalQtd" min="1" step="1">
      </div>
      <div class="field">
        <label class="field-label">Validade</label>
        <input type="text" id="perdaModalValidade" placeholder="DD/MM/AAAA ou ILEGÍVEL">
      </div>
    </div>

    <div class="field">
      <label class="field-label">Preço de compra (R$)</label>
      <input type="number" id="perdaModalValor" step="0.01" min="0">
    </div>

    <div class="modal-actions">
      <button class="btn btn-outline" id="btnCancelPerda">Cancelar</button>
      <button class="btn btn-primary" id="btnSavePerda">Salvar</button>
    </div>
  </div>
</div>

<div id="kebabMenu" class="kebab-menu">
  <button class="kebab-item" id="kebabEdit">Editar</button>
  <button class="kebab-item act-del" id="kebabDelete">Apagar</button>
</div>


<!-- ===================== MODAIS ===================== -->

<!-- ---------- Modal: Adicionar Fornecedor ---------- -->
<div id="fornecedorModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Adicionar fornecedor</h3>
    <div class="field">
      <label class="field-label">Nome do fornecedor</label>
      <input type="text" id="fornModalInput" placeholder="Ex: Distribuidora XYZ">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="btnCancelForn">Cancelar</button>
      <button type="button" class="btn btn-primary" id="btnSaveForn">Salvar</button>
    </div>
  </div>
</div>

<!-- ---------- Modal: Scanner de Código de Barras ---------- -->
<div id="scannerModal" class="modal-overlay">
  <div class="modal-box">
    <!-- Área de leitura da câmera -->
    <div id="reader"></div>
    
    <!-- Hint de instrução -->
    <div class="scan-hint">Aponte o código de barras para a câmera</div>
    
    <!-- Botões de controle na parte inferior -->
    <div class="modal-actions">
      <button type="button" id="btnTorchScan" class="btn-sm" title="Ligar/desligar lanterna">
        💡
      </button>
      
      <button type="button" id="btnGalleryScan" class="btn btn-outline" title="Ler da galeria">
        🖼️ Galeria
      </button>
      
      <button type="button" id="btnCancelScan" class="btn btn-outline" title="Cancelar leitura">
        ✕ Cancelar
      </button>
    </div>
  </div>
</div>


<!-- ===================== MENU KEBAB (3 pontos) ===================== -->
<div class="kebab-wrapper" style="position: relative; display: inline-block;">
  <button class="kebab-btn" id="kebabBtn-{id}">⋮</button>
  
  <div class="kebab-menu" id="kebabMenu-{id}">
    <button class="kebab-menu-item" id="kebabEdit-{id}">
      <span class="kebab-icon">✏️</span>
      Editar
    </button>
    <button class="kebab-menu-item" id="kebabDelete-{id}">
      <span class="kebab-icon">🗑️</span>
      Deletar
    </button>
  </div>
</div>



<!-- ===================== MODAL: Confirmar Deletar ===================== -->
<div id="confirmDeleteModal" class="modal-overlay">
  <div class="modal-box">
    <h3>Apagar Registro?</h3>
    
    <p style="color: var(--text-muted); font-size: 13.5px; line-height: 1.5; margin-bottom: 20px;">
      Tem certeza que quer apagar esse registro? Essa ação <strong>não pode ser desfeita</strong>.
    </p>

    <div class="modal-actions">
      <button type="button" class="btn btn-outline" id="btnCancelDelete">Cancelar</button>
      <button type="button" class="btn btn-danger" id="btnConfirmDelete">Apagar com Certeza</button>
    </div>
  </div>
</div>
